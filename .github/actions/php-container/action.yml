name: PHP container
description: >-
  Starts the webdevops/php container "php" for the rest of the job; run commands in it with $PHP (docker exec php).
  Blacksmith has no prebuilt PHP 8.4 and setup-php spends minutes on apt, while webdevops/php is rebuilt daily and has
  all our extensions. Only CI reaches the container; pass any other variable with docker exec -e.

runs:
  using: composite
  steps:
    # The container gets the runner's Node, so composer scripts that call npm work inside it. Opcache also for the CLI
    # makes the tests faster. The image's ionCube loader makes php -l crash with opcache on, and we have no
    # ionCube-encoded code.
    - name: Start the PHP container
      shell: bash
      run: |
        node_home=$(dirname "$(dirname "$(command -v node)")")
        mkdir -p /tmp/composer-cache
        docker run --detach --name php --network host \
          -v "$GITHUB_WORKSPACE:/app" -w /app \
          -v /tmp/composer-cache:/tmp/composer-cache -e COMPOSER_CACHE_DIR=/tmp/composer-cache \
          -v "$node_home:/opt/node:ro" \
          -e CI \
          --entrypoint sleep webdevops/php:8.4 infinity
        docker exec php sh -c '
          ln -s /opt/node/bin/node /opt/node/bin/npm /opt/node/bin/npx /usr/local/bin/ &&
          rm -f /usr/local/etc/php/conf.d/*ioncube*.ini &&
          echo opcache.enable_cli=1 > /usr/local/etc/php/conf.d/99-ci.ini'
        docker exec php php -r 'exit(ini_get("opcache.enable_cli") ? 0 : 1);'
        docker exec php git config --global --add safe.directory '*'
        echo 'PHP=docker exec php' >> "$GITHUB_ENV"
